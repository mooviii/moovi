<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <title>MOOVI</title> 
    <style> 
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial Black', 'Gadget', sans-serif; } 
        body { background: black; overflow: hidden; width: 100vw; height: 100vh; } 

        :root {
             --v-width-pct: 82.5%;    
             --v-height-pct: 86%;     
             --v-radius: 10px; 
        }

        /* --- FUNDIDO INICIAL --- */
        #blackout {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: black;
            z-index: 999;
            pointer-events: none;
            animation: fadeToTrans 3s forwards;
        }

        @keyframes fadeToTrans {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* --- FONDO ANIMADO --- */ 
        .curtain-bg { 
             position: absolute; 
             top: 0; left: 0; width: 100%; height: 100%; 
             background: url('medios/fondo.jpg') center/cover no-repeat; 
             z-index: 1; 
             animation: curtainSway 8s ease-in-out infinite alternate; 
             transform-origin: top center; 
        } 
        .curtain-overlay { 
             position: absolute; 
             top: 0; left: 0; width: 100%; height: 100%; 
             background: linear-gradient(90deg, rgba(0,0,0,0.2) 0%, rgba(255,255,255,0.05) 25%, rgba(0,0,0,0.2) 50%, rgba(255,255,255,0.05) 75%, rgba(0,0,0,0.2) 100%); 
             background-size: 200% 100%; 
             animation: shadowMove 12s linear infinite; 
             pointer-events: none; 
             z-index: 2; 
        } 

        @keyframes curtainSway { 
             0% { transform: scale(1.0) skewX(0deg); filter: brightness(1); } 
             50% { transform: scale(1.02) skewX(1deg); filter: brightness(1.1); } 
             100% { transform: scale(1.01) skewX(-1deg); filter: brightness(0.95); } 
        } 
        @keyframes shadowMove { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } } 

        /* --- ANIMACIONES --- */ 
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes zoomOutEffect { from { transform: scale(1.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulseIndicator { 0% { transform: scale(1); opacity: 0.9; filter: drop-shadow(0 0 10px rgba(255,255,255,0.4)); } 50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 35px rgba(255,255,255,0.9)); } 100% { transform: scale(1); opacity: 0.9; filter: drop-shadow(0 0 10px rgba(255,255,255,0.4)); } } 
        
        @keyframes popNumber {
            0% { transform: scale(1); box-shadow: 0 0 0px rgba(255,255,255,0); border-color: #ddd; }
            50% { transform: scale(1.15); box-shadow: 0 0 30px rgba(255,255,255,0.8); border-color: #fff; }
            100% { transform: scale(1); box-shadow: 0 0 0px rgba(255,255,255,0); border-color: #ddd; }
        }

        .pop { animation: popNumber 0.5s ease-out; }
        .pop-loop { animation: popNumber 3s infinite ease-in-out; }
        .zoom-in-screen { animation: zoomOutEffect 0.8s ease-out forwards; }

        .screen { position: absolute; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 10; } 
         
        .metal-text {  
             text-transform: uppercase;  
             background: linear-gradient(to bottom, #ffffff 0%, #eeeeee 100%);  
             -webkit-background-clip: text;  
             -webkit-text-fill-color: transparent;  
             filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));  
             text-shadow: 0px 1px 0px #cccccc, 0px 2px 0px #bbbbbb, 0px 3px 0px #aaaaaa, 0px 4px 15px rgba(0,0,0,0.7);  
        } 

        /* --- PORTADA --- */
        #introScreen { z-index: 20; }
        .intro-bg {
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: url('medios/portada.png') center/cover;
        }
        .intro-ui { 
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            animation: zoomOutEffect 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; 
        }
        .logo-box { background: rgba(255, 255, 255, 0.1); border: 4px solid #ddd; border-radius: 20px; padding: 25px 50px; box-shadow: 0 0 20px rgba(0,0,0,0.5); margin-top: -15vh; }
        .start-prompt { position: absolute; bottom: 35vh; font-size: 1.4vw; letter-spacing: 0.5vw; animation: pulseIndicator 4s infinite ease-in-out; }
        .copyright-text { position: absolute; bottom: 28vh; width: 100%; font-size: 1.0vw; color: rgba(255,255,255,0.4); letter-spacing: 0.1vw; text-align: center; font-weight: normal; }

        /* --- INPUT --- */
        #codeDisplay { display: flex; gap: 2vw; min-height: 18vw; align-items: center; justify-content: center; } 
        .num-box { 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 12px; 
            border: 2px solid #dddddd; 
            display: inline-flex; 
            justify-content: center; 
            align-items: center; 
            width: 15vw; 
            height: 18vw; 
            transition: all 0.2s;
        } 
        .num-box b { font-size: 12vw; }
        .sub-text { margin-top: 4vh; font-size: 1.8vw; color: #000; text-transform: uppercase; letter-spacing: 0.2vw; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 8px rgba(255,255,255,0.8); } 
        .error-msg { font-size: 9vw; color: #ff0000; font-weight: 900; letter-spacing: -0.2vw; }

        /* --- SELECCIÓN DE MODO --- */
        .mode-option { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            font-size: 2.2vw; 
            display: flex; 
            align-items: center; 
            font-weight: bold;
            letter-spacing: 0.1vw;
        }
        .mode-num { 
            width:65px; 
            height:60px; 
            margin-right:25px; 
            border-radius: 10px; 
            border: 2px solid #ddd; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: rgba(255,255,255,0.1); 
            font-family: 'Arial Black', sans-serif; 
        }

        /* --- VIDEO Y CELULOIDE --- */
        #videoScreen { background: black; z-index: 50; } 
        .celuloide-frame { position: relative; height: 100vh; aspect-ratio: 16 / 9; display: flex; justify-content: center; align-items: center; }
        .celuloide-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('medios/celuloide.png') center/contain no-repeat; z-index: 52; pointer-events: none; }
        #videoPlayer { position: absolute; width: var(--v-width-pct); height: var(--v-height-pct); object-fit: cover; z-index: 51; border-radius: var(--v-radius); opacity: 0; transition: opacity 1.5s ease; }  
        
        /* --- CORRECCIÓN HALO ALTAVOZ (MODO 3) --- */
        #audioModeIndicator { position: absolute; z-index: 53; display: none; font-size: 18vw; color: #ddd; animation: pulseIndicator 3s infinite ease-in-out; }
        
        /* --- AJUSTES DE FOTOGRAMAS (MODO 2) --- */
        .photo-container { position: absolute; width: var(--v-width-pct); height: var(--v-height-pct); z-index: 51; border-radius: var(--v-radius); overflow: hidden; display: none; background: #000; }
        .photo-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 3.5s ease-in-out; } 
        .photo-slide.active { opacity: 1; }
        .fade-in-container { animation: fadeIn 1.5s ease forwards; }
        .fade-out-container { animation: fadeOut 1.5s ease forwards; } 

        /* --- RESPUESTA --- */
        .answer-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('medios/respuesta.jpg') center/cover no-repeat; z-index: 5; }
        .answer-box { 
            position: relative; 
            border: 4px solid rgba(255,255,255,0.7); 
            border-radius: 25px; 
            padding: 4vh 6vw; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 1.5vh; 
            box-shadow: 0 0 60px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.1); 
            max-width: 85vw; 
            z-index: 10; 
            animation: zoomOutEffect 0.7s ease-out; 
        }
        #videoTitle { font-size: 4.2vw; letter-spacing: 0.1vw; }
        #videoYear { font-size: 13vw; line-height: 0.9; margin: 1vh 0; }
        #videoDirector { font-size: 2.8vw; letter-spacing: 0.2vw; }
    </style> 
</head> 
<body> 

<div id="blackout"></div>

<div id="introScreen" class="screen">
     <div class="intro-bg"></div>
     <div class="intro-ui">
         <div class="logo-box"><div class="metal-text" style="font-size:12vw; line-height:1;">MOOVI</div></div>
         <div class="metal-text start-prompt">PULSA ENTER PARA INICIAR JUEGO</div>
         <div class="copyright-text">2026 © all rights reserved</div>
     </div>
</div>

<div class="curtain-bg"></div> 
<div class="curtain-overlay"></div> 

<div id="modeScreen" class="screen" style="display:none;"> 
     <div class="metal-text" style="font-size: 4vw; margin-bottom: 5vh; letter-spacing: 0.6vw; border-bottom: 2px solid rgba(255,255,255,0.3); padding-bottom: 10px;">MODOS DE JUEGO</div> 
     <div style="display: flex; flex-direction: column; gap: 4vh;"> 
         <div class="metal-text mode-option"><div class="mode-num pop-loop"><b class="metal-text" style="font-size:2.2vw;">1</b></div> FÁCIL ( AUDIO + VIDEO )</div> 
         <div class="metal-text mode-option"><div class="mode-num pop-loop"><b class="metal-text" style="font-size:2.2vw;">2</b></div> INTERMEDIO ( FOTOGRAMAS )</div> 
         <div class="metal-text mode-option"><div class="mode-num pop-loop"><b class="metal-text" style="font-size:2.2vw;">3</b></div> DIFÍCIL ( SOLO AUDIO )</div> 
     </div> 
</div> 

<div id="mainScreen" class="screen" style="display:none;"> 
     <div id="codeDisplay"></div> 
     <div id="instructionText" class="sub-text">Introduce el código de la tarjeta y pulsa enter</div> 
</div> 

<div id="videoScreen" class="screen" style="display:none;"> 
     <div class="celuloide-frame">
         <div class="celuloide-overlay"></div>
         <div id="audioModeIndicator">🔊</div> 
         <div id="photoContainer" class="photo-container"><img id="imgSlide1" class="photo-slide"><img id="imgSlide2" class="photo-slide"></div>
         <video id="videoPlayer"></video> 
     </div>
</div> 

<div id="blackScreen" class="screen" style="display:none;"> 
     <div class="answer-bg"></div>
     <div class="metal-text" style="position:relative; z-index:10; font-size: 5.5vw; line-height: 1.2; animation: pulseIndicator 4s infinite ease-in-out;">PULSA ENTER PARA<br>VER LA SOLUCIÓN</div> 
</div> 

<div id="titleScreen" class="screen" style="display:none;"> 
     <div class="answer-bg"></div>
     <div id="answerBox" class="answer-box">
         <div id="videoTitle" class="metal-text">TITULO</div> 
         <div id="videoYear" class="metal-text">0000</div> 
         <div id="videoDirector" class="metal-text">DIRECTOR</div> 
     </div>
</div> 

<audio id="soundType" src="medios/type.mp3"></audio> 
<audio id="soundClaqueta" src="medios/claqueta.mp3"></audio> 
<audio id="soundError" src="medios/error.mp3"></audio> 
<audio id="soundSelect" src="medios/select.mp3"></audio> 
<audio id="soundEscape" src="medios/escape.mp3"></audio> 
<audio id="soundRespuesta" src="medios/respuesta.mp3"></audio> 
<audio id="soundBackground" src="medios/musica1.mp3" loop></audio> 

<script src="medios/datos.js"></script> 
<script> 
let state = "intro"; 
let gameMode = "video"; 
let code = ""; 
let isUserMuted = false;  
let photoTimer = null;

const sounds = { 
    type: document.getElementById("soundType"), 
    claqueta: document.getElementById("soundClaqueta"), 
    error: document.getElementById("soundError"), 
    select: document.getElementById("soundSelect"), 
    escape: document.getElementById("soundEscape"), 
    respuesta: document.getElementById("soundRespuesta"), 
    bg: document.getElementById("soundBackground") 
}; 

const videoPlayer = document.getElementById("videoPlayer"); 
const audioIndicator = document.getElementById("audioModeIndicator"); 
const photoContainer = document.getElementById("photoContainer");
const imgSlide1 = document.getElementById("imgSlide1");
const imgSlide2 = document.getElementById("imgSlide2");
const codeDisplay = document.getElementById("codeDisplay"); 
const instructionText = document.getElementById("instructionText"); 
const answerBox = document.getElementById("answerBox");

sounds.bg.volume = 0.01; 

function getTechnicolor() {
    const colors = [
        'rgba(180, 40, 40, 0.9)',    
        'rgba(40, 100, 180, 0.9)',   
        'rgba(160, 130, 20, 0.9)',   
        'rgba(80, 40, 140, 0.9)',    
        'rgba(30, 120, 80, 0.9)',    
        'rgba(200, 90, 30, 0.9)',    
        'rgba(50, 50, 50, 0.95)'     
    ];
    return colors[Math.floor(Math.random() * colors.length)];
}

function playSound(s) { s.currentTime = 0; s.play().catch(()=>{}); } 

document.addEventListener("keydown", (e) => { 
    if (e.key.toLowerCase() === "m") { isUserMuted = !isUserMuted; sounds.bg.muted = isUserMuted; return; } 

    if (state === "intro" && e.key === "Enter") {
        state = "mode_selection";
        sounds.bg.play();
        document.getElementById("introScreen").style.display = "none";
        document.getElementById("modeScreen").style.display = "flex";
        return;
    }

    if (e.key === "Escape") { 
        if (state === "mode_selection" || state === "intro") return; 
        playSound(sounds.escape); 
        clearTimeout(photoTimer);
        state === "input" ? resetToModeSelection() : resetToInput(); 
        return; 
    } 

    if (state === "mode_selection") { 
        if (e.key === "1" || e.key === "2" || e.key === "3") { 
            const modes = { "1": "video", "2": "photos", "3": "audio" };
            gameMode = modes[e.key];
            playSound(sounds.select); 
            state = "input";
            const mainScr = document.getElementById("mainScreen");
            document.getElementById("modeScreen").style.display = "none"; 
            mainScr.style.display = "flex"; 
            mainScr.classList.remove("zoom-in-screen");
            void mainScr.offsetWidth; 
            mainScr.classList.add("zoom-in-screen");
            updateDisplay(); 
        } 
    } else if (state === "input") { 
        if (e.key >= "0" && e.key <= "9" && code.length < 3) { 
            code += e.key; 
            playSound(sounds.type); 
            updateDisplay(true); 
        } else if (e.key === "Backspace") { 
            code = code.slice(0, -1); 
            playSound(sounds.type); 
            updateDisplay(); 
        } else if (e.key === "Enter") { 
            if (code.length > 0 && videoDB[code]) {
                handleStartSequence(); 
            } else {
                triggerError(); 
            }
        } 
    } else if (state === "black" && e.key === "Enter") { 
        playSound(sounds.respuesta); 
        showTitle(); 
    } else if (state === "title" && e.key === "Enter") { 
        playSound(sounds.respuesta); 
        resetToInput(); 
    } else if (state === "video" && e.key === "Enter") { 
        stopCurrentMedia();
    } 
}); 

function updateDisplay(isNewNumber = false) { 
    codeDisplay.innerHTML = ""; 
    for (let i = 0; i < 3; i++) { 
        const box = document.createElement("div"); 
        box.className = "num-box"; 
        const charToShow = i < code.length ? code[i] : '_';
        box.innerHTML = `<b class="metal-text">${charToShow}</b>`; 
        if (isNewNumber && i === code.length - 1) { box.classList.add("pop"); }
        codeDisplay.appendChild(box); 
    } 
} 

function handleStartSequence() { 
    state = "waiting"; 
    if (gameMode !== "photos") { sounds.bg.muted = true; }
    playSound(sounds.claqueta); 
    sounds.claqueta.onended = () => { if (state === "waiting") startMedia(videoDB[code]); }; 
} 

function startMedia(data) { 
    state = "video"; 
    document.getElementById("mainScreen").style.display = "none"; 
    document.getElementById("videoScreen").style.display = "flex"; 
    videoPlayer.style.display = "none"; audioIndicator.style.display = "none"; photoContainer.style.display = "none";
    photoContainer.classList.remove("fade-in-container", "fade-out-container");
    imgSlide1.classList.remove("active"); imgSlide2.classList.remove("active");

    if (gameMode === "video") {
        videoPlayer.style.display = "block"; videoPlayer.style.opacity = 1;
        videoPlayer.src = "videos/" + data.src; videoPlayer.play();
        videoPlayer.ontimeupdate = () => { if (videoPlayer.duration - videoPlayer.currentTime < 0.5) stopCurrentMedia(); };
    } 
    else if (gameMode === "photos") {
        photoContainer.style.display = "block"; photoContainer.classList.add("fade-in-container");
        const baseName = data.src.split('.')[0]; 
        imgSlide1.src = `videos/${baseName}-img1.jpg`; imgSlide2.src = `videos/${baseName}-img2.jpg`;
        imgSlide1.classList.add("active");
        
        photoTimer = setTimeout(() => {
            imgSlide1.classList.remove("active"); 
            imgSlide2.classList.add("active");
            photoTimer = setTimeout(() => {
                photoContainer.classList.add("fade-out-container");
                setTimeout(() => { stopCurrentMedia(); }, 1500); 
            }, 8000); 
        }, 7000);
    } 
    else if (gameMode === "audio") {
        audioIndicator.style.display = "block"; videoPlayer.src = "videos/" + data.src;
        videoPlayer.style.display = "block"; videoPlayer.style.opacity = 0; videoPlayer.play();
        videoPlayer.ontimeupdate = () => { if (videoPlayer.duration - videoPlayer.currentTime < 0.5) stopCurrentMedia(); };
    }
} 

function stopCurrentMedia() { 
    clearTimeout(photoTimer); 
    videoPlayer.pause(); 
    state = "black"; 
    if (!isUserMuted) { sounds.bg.muted = false; }
    document.getElementById("videoScreen").style.display = "none"; 
    document.getElementById("blackScreen").style.display = "flex"; 
} 

function showTitle() { 
    state = "title"; 
    const m = videoDB[code]; 
    answerBox.style.backgroundColor = getTechnicolor(); 
    document.getElementById("blackScreen").style.display = "none"; 
    document.getElementById("titleScreen").style.display = "flex"; 
    document.getElementById("videoTitle").textContent = m.title; 
    document.getElementById("videoYear").textContent = m.year; 
    document.getElementById("videoDirector").textContent = m.director; 
} 

function resetToInput() { state = "input"; code = ""; videoPlayer.pause(); videoPlayer.src = ""; document.querySelectorAll(".screen").forEach(s => s.style.display = "none"); document.getElementById("mainScreen").style.display = "flex"; updateDisplay(); } 
function resetToModeSelection() { state = "mode_selection"; code = ""; document.querySelectorAll(".screen").forEach(s => s.style.display = "none"); document.getElementById("modeScreen").style.display = "flex"; } 
function triggerError() { playSound(sounds.error); instructionText.style.visibility = "hidden"; codeDisplay.innerHTML = '<span class="error-msg">CÓDIGO ERRÓNEO</span>'; setTimeout(() => { code = ""; updateDisplay(); instructionText.style.visibility = "visible"; }, 800); } 
</script> 
</body> 
</html>
